name: MacTalk
options:
  bundleIdPrefix: com.mactalk
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en

configs:
  Debug: debug
  Release: release
  DebugTSan: debug

settings:
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
  MACOSX_DEPLOYMENT_TARGET: "26.0"

packages:
  # Pin the API-compatible release used by the verified build.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.5

targets:
  MacTalk:
    type: application
    platform: macOS
    sources:
      - path: MacTalk/MacTalk
        excludes:
          - "*.xcodeproj"
          - "*.xcworkspace"
    info:
      path: MacTalk/MacTalk/Info.plist
      properties:
        CFBundleIdentifier: com.mactalk.app
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        LSUIElement: true
        NSMicrophoneUsageDescription: "MacTalk needs microphone access to transcribe your voice."
        NSAppleEventsUsageDescription: "MacTalk needs accessibility permission to auto-paste transcriptions."
        LSApplicationCategoryType: "public.app-category.productivity"
        NSHumanReadableCopyright: "Copyright © 2025 MacTalk Development Team"
        NSPrincipalClass: "NSApplication"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mactalk.app
        INFOPLIST_FILE: MacTalk/MacTalk/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: MacTalk/MacTalk/Whisper/WhisperBridge.h
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/Vendor/whisper.cpp
          - $(PROJECT_DIR)/Vendor/whisper.cpp/include
          - $(PROJECT_DIR)/Vendor/whisper.cpp/src
          - $(PROJECT_DIR)/Vendor/whisper.cpp/ggml/include
        LIBRARY_SEARCH_PATHS:
          - $(PROJECT_DIR)/Vendor/whisper.cpp/build/src
          - $(PROJECT_DIR)/Vendor/whisper.cpp/build/ggml/src
        OTHER_LDFLAGS:
          - -lwhisper
          - -lsqlite3
          - -framework Accelerate
          - -framework Metal
          - -framework Foundation
          - -framework AVFoundation
          - -framework AppKit
          - -framework ScreenCaptureKit
          - -framework UserNotifications
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "9SXL4GJ4TZ"
        CODE_SIGN_ENTITLEMENTS: MacTalk/MacTalk/MacTalk.entitlements
        GENERATE_INFOPLIST_FILE: NO
      configs:
        DebugTSan:
          ENABLE_THREAD_SANITIZER: YES
    dependencies:
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: Foundation.framework
      - sdk: AVFoundation.framework
      - sdk: AppKit.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: UserNotifications.framework
      - sdk: CoreML.framework
      - sdk: libsqlite3.tbd
      - package: FluidAudio
    postBuildScripts:
      - name: Copy Whisper Libraries
        inputFiles:
          - $(PROJECT_DIR)/Vendor/whisper.cpp/build/src/libwhisper.1.dylib
          - $(PROJECT_DIR)/Vendor/whisper.cpp/build/ggml/src/libggml.dylib
          - $(PROJECT_DIR)/Vendor/whisper.cpp/build/ggml/src/libggml-base.dylib
          - $(PROJECT_DIR)/Vendor/whisper.cpp/build/ggml/src/libggml-cpu.dylib
          - $(PROJECT_DIR)/Vendor/whisper.cpp/build/ggml/src/ggml-blas/libggml-blas.dylib
          - $(PROJECT_DIR)/Vendor/whisper.cpp/build/ggml/src/ggml-metal/libggml-metal.dylib
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libwhisper.1.dylib
          - $(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libggml.dylib
          - $(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libggml-base.dylib
          - $(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libggml-cpu.dylib
          - $(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libggml-blas.dylib
          - $(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libggml-metal.dylib
        script: |
          #!/bin/bash
          set -euo pipefail
          # Create Frameworks directory
          mkdir -p "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"

          # Copy whisper.cpp libraries. Missing inputs are build failures, not optional warnings.
          cp -f "${PROJECT_DIR}/Vendor/whisper.cpp/build/src/libwhisper.1.dylib" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/"
          cp -f "${PROJECT_DIR}/Vendor/whisper.cpp/build/ggml/src/libggml.dylib" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/"
          cp -f "${PROJECT_DIR}/Vendor/whisper.cpp/build/ggml/src/libggml-base.dylib" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/"
          cp -f "${PROJECT_DIR}/Vendor/whisper.cpp/build/ggml/src/libggml-cpu.dylib" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/"
          cp -f "${PROJECT_DIR}/Vendor/whisper.cpp/build/ggml/src/ggml-blas/libggml-blas.dylib" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/"
          cp -f "${PROJECT_DIR}/Vendor/whisper.cpp/build/ggml/src/ggml-metal/libggml-metal.dylib" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/"

          # Fix install names. Any failed rewrite invalidates the release bundle.
          install_name_tool -id "@rpath/libwhisper.1.dylib" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/libwhisper.1.dylib"
          install_name_tool -id "@rpath/libggml.dylib" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/libggml.dylib"
          install_name_tool -id "@rpath/libggml-base.dylib" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/libggml-base.dylib"
          install_name_tool -id "@rpath/libggml-cpu.dylib" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/libggml-cpu.dylib"
          install_name_tool -id "@rpath/libggml-blas.dylib" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/libggml-blas.dylib"
          install_name_tool -id "@rpath/libggml-metal.dylib" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/libggml-metal.dylib"

          # Update dependencies in libwhisper.
          install_name_tool -change "@rpath/libggml.dylib" "@rpath/libggml.dylib" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/libwhisper.1.dylib"

          # Fix library references in the debug dylib (CRITICAL for macOS 26).
          if [ -f "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/${PRODUCT_NAME}.debug.dylib" ]; then
            install_name_tool -change "@rpath/libwhisper.1.dylib" "@loader_path/../Frameworks/libwhisper.1.dylib" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/${PRODUCT_NAME}.debug.dylib"
            install_name_tool -change "@rpath/libggml.dylib" "@loader_path/../Frameworks/libggml.dylib" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/${PRODUCT_NAME}.debug.dylib"
            install_name_tool -change "@rpath/libggml-base.dylib" "@loader_path/../Frameworks/libggml-base.dylib" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/${PRODUCT_NAME}.debug.dylib"
            install_name_tool -change "@rpath/libggml-cpu.dylib" "@loader_path/../Frameworks/libggml-cpu.dylib" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/${PRODUCT_NAME}.debug.dylib"
            install_name_tool -change "@rpath/libggml-blas.dylib" "@loader_path/../Frameworks/libggml-blas.dylib" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/${PRODUCT_NAME}.debug.dylib"
            install_name_tool -change "@rpath/libggml-metal.dylib" "@loader_path/../Frameworks/libggml-metal.dylib" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/${PRODUCT_NAME}.debug.dylib"
            echo "Fixed library paths in ${PRODUCT_NAME}.debug.dylib"
          fi

          echo "Copied whisper libraries to ${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
      - name: Re-sign Libraries and App Bundle
        basedOnDependencyAnalysis: false
        runOnlyForDeploymentPostprocessing: false
        script: |
          #!/bin/bash
          set -euo pipefail
          # CRITICAL for macOS 26: Re-sign all dylibs to fix Team ID mismatch
          # This must run AFTER Xcode's CodeSign phase
          # IMPORTANT: Use same certificate as main app to preserve accessibility permissions across builds

          # Unsigned CI/test builds intentionally skip this release-only phase.
          if [ "${CODE_SIGNING_ALLOWED:-YES}" != "YES" ]; then
            echo "⏭️  [Post-Build] Code signing disabled by build settings"
            exit 0
          fi

          SIGNING_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:-}}"
          if [ -z "$SIGNING_IDENTITY" ] || [ "$SIGNING_IDENTITY" = "-" ]; then
            echo "❌ [Post-Build] No signing identity is available" >&2
            exit 1
          fi

          echo "🔐 [Post-Build] Re-signing whisper.cpp libraries with: $SIGNING_IDENTITY"

          # Re-sign all dylibs in Frameworks with the same certificate as the app.
          found_library=false
          for lib in "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"/*.dylib; do
            if [ -f "$lib" ]; then
              found_library=true
              codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$lib"
              echo "   ✅ Signed: $(basename "$lib")"
            fi
          done
          if [ "$found_library" != true ]; then
            echo "❌ [Post-Build] No nested dylibs were found to sign" >&2
            exit 1
          fi

          # Re-sign the app bundle with the same certificate. Preserve the
          # entitlements generated by Xcode and keep the hardened-runtime flag.
          echo "🔐 [Post-Build] Re-signing app bundle with: $SIGNING_IDENTITY"
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" \
            --preserve-metadata=entitlements,requirements,flags \
            "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app"

          echo "✅ [Post-Build] Code signing complete with identity: $SIGNING_IDENTITY"

  MacTalkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacTalk/MacTalkTests
        excludes:
          - Fixtures
    postBuildScripts:
      - name: Copy Verified CoreML Fixture
        inputFiles:
          - $(PROJECT_DIR)/MacTalk/MacTalkTests/Fixtures/VerifiedCoreMLFixture/model.mlmodel
          - $(PROJECT_DIR)/MacTalk/MacTalkTests/Fixtures/VerifiedCoreMLFixture/weights/weight.bin
          - $(PROJECT_DIR)/MacTalk/MacTalkTests/Fixtures/VerifiedCoreMLFixture/fixture-manifest.json
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/VerifiedCoreMLFixture/model.mlmodel
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/VerifiedCoreMLFixture/weights/weight.bin
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/VerifiedCoreMLFixture/fixture-manifest.json
        script: |
          #!/bin/bash
          set -euo pipefail
          source_fixture="${PROJECT_DIR}/MacTalk/MacTalkTests/Fixtures/VerifiedCoreMLFixture"
          copy_fixture() {
            local fixture="$1"
            mkdir -p "$fixture/weights"
            cp -f "$source_fixture/model.mlmodel" "$fixture/model.mlmodel"
            cp -f "$source_fixture/weights/weight.bin" "$fixture/weights/weight.bin"
            cp -f "$source_fixture/fixture-manifest.json" "$fixture/fixture-manifest.json"
          }
          copy_fixture "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/VerifiedCoreMLFixture"
          nested="${BUILT_PRODUCTS_DIR}/MacTalk.app/Contents/PlugIns/MacTalkTests.xctest/Contents/Resources/VerifiedCoreMLFixture"
          if [ -d "$(dirname "$nested")" ]; then
            copy_fixture "$nested"
          fi
    settings:
      BUNDLE_LOADER: "$(TEST_HOST)"
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacTalk.app/Contents/MacOS/MacTalk"
      PRODUCT_BUNDLE_IDENTIFIER: com.mactalk.app.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MacTalk
      - target: ParakeetStoreLockProbe
  ParakeetStoreLockProbe:
    type: tool
    platform: macOS
    sources:
      - path: Tools/ParakeetStoreLockProbe
      - path: MacTalk/MacTalk/Whisper/ParakeetStoreFileLock.swift
    settings:
      SWIFT_VERSION: "6.0"
      SWIFT_STRICT_CONCURRENCY: complete
      MACOSX_DEPLOYMENT_TARGET: "26.0"

schemes:
  MacTalk:
    build:
      targets:
        MacTalk: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacTalkTests
      # Thread Sanitizer disabled by default for faster test runs.
      # Enable with: xcodebuild test -enableThreadSanitizer YES
      # Or use the MacTalk-TSan scheme below.
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Thread Sanitizer scheme for concurrency validation (S.02.3a)
  MacTalk-TSan:
    build:
      targets:
        MacTalk: all
    run:
      config: DebugTSan
      environmentVariables:
        TSAN_OPTIONS: "halt_on_error=1"
    test:
      config: DebugTSan
      targets:
        - MacTalkTests
      diagnostics:
        threadSanitizer: true
        # Keep sanitizer instrumentation in the generated scheme itself;
        # callers must not rely on an uninstrumented xcodebuild override.
      environmentVariables:
        TSAN_OPTIONS: "halt_on_error=1"
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
