name: MacTalk Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: New immutable release tag matching scripts/release-version.env (never v1.1.3)
        required: true
        type: string

# Jobs default to no token. Only the final publish job can mutate releases.
permissions: {}
concurrency:
  group: mactalk-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Verify immutable tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source before secrets
        run: RELEASE_TAG="$RELEASE_TAG" bash scripts/release-preflight.sh

  build:
    name: Fresh archive and verify
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MACTALK_CODE_SIGN_IDENTITY: ${{ vars.MACTALK_CODE_SIGN_IDENTITY }}
      MACTALK_DEVELOPMENT_TEAM: ${{ vars.MACTALK_DEVELOPMENT_TEAM }}
      MACTALK_KEYCHAIN_PATH: ${{ runner.temp }}/mactalk-release.keychain-db
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source before signing secrets
        run: RELEASE_TAG="$RELEASE_TAG" bash scripts/release-preflight.sh
      - name: Install XcodeGen
        run: |
          XCODEGEN_INSTALL_DIR="$RUNNER_TOOL_CACHE/xcodegen/2.44.1" bash scripts/install_xcodegen.sh
          echo "$RUNNER_TOOL_CACHE/xcodegen/2.44.1/bin" >> "$GITHUB_PATH"
      - name: Generate and verify project
        run: |
          xcodegen generate
          git diff --exit-code -- MacTalk.xcodeproj
      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACTALK_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACTALK_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACTALK_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12_BASE64" -a -n "$CERTIFICATE_PASSWORD" -a -n "$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$MACTALK_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$MACTALK_KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$MACTALK_KEYCHAIN_PATH"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$MACTALK_KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$MACTALK_KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$MACTALK_KEYCHAIN_PATH"
      - name: Archive from fresh whisper.cpp build
        env:
          MACTALK_CODE_SIGN_IDENTITY: ${{ vars.MACTALK_CODE_SIGN_IDENTITY }}
          MACTALK_DEVELOPMENT_TEAM: ${{ vars.MACTALK_DEVELOPMENT_TEAM }}
        run: bash scripts/archive-release.sh --output-dir "$RUNNER_TEMP/mactalk-release"
      - name: Verify archive, provenance, and secure timestamps
        env:
          MACTALK_CODE_SIGN_IDENTITY: ${{ vars.MACTALK_CODE_SIGN_IDENTITY }}
          MACTALK_DEVELOPMENT_TEAM: ${{ vars.MACTALK_DEVELOPMENT_TEAM }}
        run: bash scripts/verify-release.sh --output-dir "$RUNNER_TEMP/mactalk-release"
      - name: Upload verified archive
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: mactalk-verified-archive
          path: ${{ runner.temp }}/mactalk-release
          if-no-files-found: error
      - name: Remove signing keychain and certificate
        if: always()
        run: |
          security delete-keychain "$MACTALK_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"

  notarize:
    name: Notarize and verify artifact
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MACTALK_CODE_SIGN_IDENTITY: ${{ vars.MACTALK_CODE_SIGN_IDENTITY }}
      MACTALK_DEVELOPMENT_TEAM: ${{ vars.MACTALK_DEVELOPMENT_TEAM }}
      MACTALK_KEYCHAIN_PATH: ${{ runner.temp }}/mactalk-release.keychain-db
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source before notarization secrets
        run: RELEASE_TAG="$RELEASE_TAG" bash scripts/release-preflight.sh
      - name: Download verified archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mactalk-verified-archive
          path: ${{ runner.temp }}/mactalk-release
      - name: Import signing certificate for DMG timestamp
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACTALK_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACTALK_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACTALK_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12_BASE64" -a -n "$CERTIFICATE_PASSWORD" -a -n "$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$MACTALK_KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$MACTALK_KEYCHAIN_PATH"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$MACTALK_KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$MACTALK_KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$MACTALK_KEYCHAIN_PATH"
      - name: Notarize, staple, and verify final DMG
        env:
          MACTALK_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.MACTALK_NOTARY_KEYCHAIN_PROFILE }}
          APPLE_ID: ${{ secrets.MACTALK_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACTALK_APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACTALK_APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/notarize-release.sh --output-dir "$RUNNER_TEMP/mactalk-release"
      - name: Upload notarized artifact and manifest
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: mactalk-notarized-release
          path: |
            ${{ runner.temp }}/mactalk-release/MacTalk-*.dmg
            ${{ runner.temp }}/mactalk-release/MacTalk-*-manifest.txt
            ${{ runner.temp }}/mactalk-release/release-provenance.env
            ${{ runner.temp }}/mactalk-release/release-provenance.env.sha256
          if-no-files-found: error
      - name: Remove signing keychain and certificate
        if: always()
        run: |
          security delete-keychain "$MACTALK_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"

  publish:
    name: Draft, upload, checksum verify, publish
    needs: notarize
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download notarized artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mactalk-notarized-release
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "MacTalk $RELEASE_TAG" --generate-notes
      - name: Upload DMG and manifest to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release/MacTalk-*.dmg release/MacTalk-*-manifest.txt --clobber
      - name: Verify uploaded checksum before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dmg="$(find release -name 'MacTalk-*.dmg' -print -quit)"
          expected="$(awk -F= '$1 == "sha256" { print $2 }' release/MacTalk-*-manifest.txt)"
          actual="$(sha256sum "$dmg" | awk '{print $1}')"
          test -n "$expected" -a "$expected" = "$actual"
          remote="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name == "'"$(basename "$dmg")"'") | .digest')"
          test "$remote" = "sha256:$expected"
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false
