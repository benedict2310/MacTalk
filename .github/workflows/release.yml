name: MacTalk Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package (for example v1.1.3)
        required: true
        type: string

# The job only needs to upload one GitHub release and its artifacts.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACTALK_CODE_SIGN_IDENTITY: ${{ vars.MACTALK_CODE_SIGN_IDENTITY }}
      MACTALK_DEVELOPMENT_TEAM: ${{ vars.MACTALK_DEVELOPMENT_TEAM }}
      APPLE_ID: ${{ secrets.MACTALK_APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.MACTALK_APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACTALK_APP_SPECIFIC_PASSWORD }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install XcodeGen
        run: |
          XCODEGEN_INSTALL_DIR="$RUNNER_TOOL_CACHE/xcodegen/2.44.1" bash scripts/install_xcodegen.sh
          echo "$RUNNER_TOOL_CACHE/xcodegen/2.44.1/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: xcodegen generate

      - name: Verify generated project
        run: git diff --exit-code -- MacTalk.xcodeproj

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACTALK_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACTALK_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACTALK_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          keychain="$RUNNER_TEMP/mactalk-release.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"

      - name: Archive
        run: bash scripts/archive-release.sh --output-dir "$RUNNER_TEMP/mactalk-release"

      - name: Verify archive signing and version
        run: bash scripts/verify-release.sh --output-dir "$RUNNER_TEMP/mactalk-release"

      - name: Notarize, staple, assess, and checksum
        run: bash scripts/notarize-release.sh --output-dir "$RUNNER_TEMP/mactalk-release"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          source scripts/release-version.env
          test "$RELEASE_TAG" = "v$MACTALK_MARKETING_VERSION"
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/mactalk-release/MacTalk-$MACTALK_MARKETING_VERSION.dmg" \
            "$RUNNER_TEMP/mactalk-release/MacTalk-$MACTALK_MARKETING_VERSION-manifest.txt" \
            --verify-tag \
            --title "MacTalk $RELEASE_TAG" \
            --generate-notes
