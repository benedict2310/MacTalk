name: MacTalk Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: New immutable release tag matching scripts/release-version.env (never v1.1.3)
        required: true
        type: string

# Jobs default to no token. Only the final publish job can mutate releases.
permissions: {}
concurrency:
  group: mactalk-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Verify immutable tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source before secrets
        id: source
        run: |
          set -euo pipefail
          output="$(RELEASE_TAG="$RELEASE_TAG" bash scripts/release-preflight.sh)"
          printf '%s\n' "$output"
          commit="$(awk -F= '$1 == "source_commit" { print $2 }' <<< "$output")"
          tag="$(head -n 1 <<< "$output")"
          test -n "$commit" -a "$tag" = "$RELEASE_TAG"
          printf 'source_commit=%s\nrelease_tag=%s\n' "$commit" "$tag" >> "$GITHUB_OUTPUT"
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
      release_tag: ${{ steps.source.outputs.release_tag }}

  build:
    name: Fresh archive and verify
    needs: preflight
    runs-on: macos-15
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_EXPECTED_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_EXPECTED_COMMIT: ${{ needs.preflight.outputs.source_commit }}
      MACTALK_CODE_SIGN_IDENTITY: ${{ vars.MACTALK_CODE_SIGN_IDENTITY }}
      MACTALK_DEVELOPMENT_TEAM: ${{ vars.MACTALK_DEVELOPMENT_TEAM }}
      MACTALK_KEYCHAIN_PATH: ${{ runner.temp }}/mactalk-release.keychain-db
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Validate propagated preflight commit
        run: |
          set -euo pipefail
          RELEASE_TAG="$RELEASE_TAG" RELEASE_EXPECTED_TAG="${{ needs.preflight.outputs.release_tag }}" RELEASE_EXPECTED_COMMIT="${{ needs.preflight.outputs.source_commit }}" bash scripts/release-preflight.sh
          test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.source_commit }}"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "${{ needs.preflight.outputs.source_commit }}"
      - name: Install XcodeGen
        run: |
          XCODEGEN_INSTALL_DIR="$RUNNER_TOOL_CACHE/xcodegen/2.44.1" bash scripts/install_xcodegen.sh
          echo "$RUNNER_TOOL_CACHE/xcodegen/2.44.1/bin" >> "$GITHUB_PATH"
      - name: Generate and verify project
        run: |
          xcodegen generate
          git diff --exit-code -- MacTalk.xcodeproj
      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACTALK_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACTALK_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACTALK_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12_BASE64" -a -n "$CERTIFICATE_PASSWORD" -a -n "$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$MACTALK_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$MACTALK_KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$MACTALK_KEYCHAIN_PATH"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$MACTALK_KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$MACTALK_KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$MACTALK_KEYCHAIN_PATH"
      - name: Archive from fresh whisper.cpp build
        env:
          MACTALK_CODE_SIGN_IDENTITY: ${{ vars.MACTALK_CODE_SIGN_IDENTITY }}
          MACTALK_DEVELOPMENT_TEAM: ${{ vars.MACTALK_DEVELOPMENT_TEAM }}
        run: bash scripts/archive-release.sh --output-dir "$RUNNER_TEMP/mactalk-release"
      - name: Verify archive, provenance, and secure timestamps
        env:
          MACTALK_CODE_SIGN_IDENTITY: ${{ vars.MACTALK_CODE_SIGN_IDENTITY }}
          MACTALK_DEVELOPMENT_TEAM: ${{ vars.MACTALK_DEVELOPMENT_TEAM }}
        run: bash scripts/verify-release.sh --output-dir "$RUNNER_TEMP/mactalk-release"
      - name: Upload verified archive handoff
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: mactalk-verified-archive
          path: |
            ${{ runner.temp }}/mactalk-release/MacTalk-release-handoff.zip
            ${{ runner.temp }}/mactalk-release/MacTalk-release-handoff.zip.sha256
          if-no-files-found: error
      - name: Remove signing keychain and certificate
        if: always()
        run: |
          security delete-keychain "$MACTALK_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"

  notarize:
    name: Notarize and verify artifact
    needs: [preflight, build]
    runs-on: macos-15
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_EXPECTED_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_EXPECTED_COMMIT: ${{ needs.preflight.outputs.source_commit }}
      MACTALK_CODE_SIGN_IDENTITY: ${{ vars.MACTALK_CODE_SIGN_IDENTITY }}
      MACTALK_DEVELOPMENT_TEAM: ${{ vars.MACTALK_DEVELOPMENT_TEAM }}
      MACTALK_KEYCHAIN_PATH: ${{ runner.temp }}/mactalk-release.keychain-db
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Validate propagated preflight commit
        run: |
          set -euo pipefail
          RELEASE_TAG="$RELEASE_TAG" RELEASE_EXPECTED_TAG="$RELEASE_EXPECTED_TAG" RELEASE_EXPECTED_COMMIT="$RELEASE_EXPECTED_COMMIT" bash scripts/release-preflight.sh
          test "$(git rev-parse HEAD)" = "$RELEASE_EXPECTED_COMMIT"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_EXPECTED_COMMIT"
      - name: Download verified archive handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mactalk-verified-archive
          path: ${{ runner.temp }}/mactalk-handoff
      - name: Extract to received and strictly reverify handoff
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mactalk-release/received"
          MACTALK_DEVELOPMENT_TEAM="$MACTALK_DEVELOPMENT_TEAM" bash scripts/reverify-handoff.sh \
            --handoff "$RUNNER_TEMP/mactalk-handoff/MacTalk-release-handoff.zip" \
            --handoff-sha256 "$RUNNER_TEMP/mactalk-handoff/MacTalk-release-handoff.zip.sha256" \
            --received-dir "$RUNNER_TEMP/mactalk-release/received" \
            --phase verified
      - name: Import signing certificate for DMG timestamp
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACTALK_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACTALK_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACTALK_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12_BASE64" -a -n "$CERTIFICATE_PASSWORD" -a -n "$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$MACTALK_KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$MACTALK_KEYCHAIN_PATH"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$MACTALK_KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$MACTALK_KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$MACTALK_KEYCHAIN_PATH"
      - name: Notarize, staple, and verify final DMG
        env:
          MACTALK_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.MACTALK_NOTARY_KEYCHAIN_PROFILE }}
          APPLE_ID: ${{ secrets.MACTALK_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACTALK_APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACTALK_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          bash scripts/notarize-release.sh \
            --output-dir "$RUNNER_TEMP/mactalk-release/received" \
            --handoff "$RUNNER_TEMP/mactalk-handoff/MacTalk-release-handoff.zip" \
            --handoff-sha256 "$RUNNER_TEMP/mactalk-handoff/MacTalk-release-handoff.zip.sha256"
      - name: Upload notarized publish handoff
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: mactalk-notarized-release
          path: |
            ${{ runner.temp }}/mactalk-release/received/MacTalk-publish-handoff.zip
            ${{ runner.temp }}/mactalk-release/received/MacTalk-publish-handoff.zip.sha256
          if-no-files-found: error
      - name: Remove signing keychain and certificate
        if: always()
        run: |
          security delete-keychain "$MACTALK_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"

  publish:
    name: Draft, upload, checksum verify, publish
    needs: [preflight, notarize]
    runs-on: macos-15
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_EXPECTED_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_EXPECTED_COMMIT: ${{ needs.preflight.outputs.source_commit }}
    steps:
      - name: Checkout exact release tag for publish binding
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert publish tag is the preflight commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_EXPECTED_COMMIT"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_EXPECTED_COMMIT"
      - name: Download notarized publish handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mactalk-notarized-release
          path: handoff
      - name: Extract and verify publish handoff
        run: |
          set -euo pipefail
          source scripts/release-common.sh
          mkdir -p release
          release_extract_handoff "$PWD/handoff/MacTalk-publish-handoff.zip" "$PWD/handoff/MacTalk-publish-handoff.zip.sha256" "$PWD/release"
          manifest="$(find release -name 'MacTalk-*-manifest.txt' -print -quit)"
          test "$(awk -F= '$1 == "commit" { print $2 }' "$manifest")" = "$RELEASE_EXPECTED_COMMIT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "MacTalk $RELEASE_TAG" --generate-notes
      - name: Upload DMG and manifest to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release/MacTalk-*.dmg release/MacTalk-*-manifest.txt --clobber
      - name: Verify uploaded checksum and remote peeled tag before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dmg="$(find release -name 'MacTalk-*.dmg' -print -quit)"
          manifest="$(find release -name 'MacTalk-*-manifest.txt' -print -quit)"
          expected="$(awk -F= '$1 == "sha256" { print $2 }' "$manifest")"
          manifest_commit="$(awk -F= '$1 == "commit" { print $2 }' "$manifest")"
          actual="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          test -n "$expected" -a "$expected" = "$actual" -a "$manifest_commit" = "$RELEASE_EXPECTED_COMMIT"
          source scripts/release-common.sh
          remote_tag_commit="$(release_verify_remote_tag "$RELEASE_TAG" "$RELEASE_EXPECTED_COMMIT")"
          test "$remote_tag_commit" = "$manifest_commit"
          remote="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name == "'"$(basename "$dmg")"'") | .digest')"
          test "$remote" = "sha256:$expected"
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false
