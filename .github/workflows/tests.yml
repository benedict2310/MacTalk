name: MacTalk CI

on:
  push:
    branches: [main, develop, 'feature/**', 'feat/**', 'claude/**']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      run_appkit:
        description: Run the explicit AppKit/window lane (no TCC or hardware)
        required: false
        default: false
        type: boolean

permissions: {}
concurrency:
  group: mactalk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: '2.44.1'
  MACTALK_XCODE_VERSION: '26.0'

jobs:
  unit:
    name: Deterministic unit tests (blocking)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee build-xcode-version.txt
          grep -F "Xcode ${MACTALK_XCODE_VERSION}" build-xcode-version.txt
          printf 'xcode_version=%s\n' "$(shasum -a 256 build-xcode-version.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: mactalk-spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode_version }}-${{ hashFiles('MacTalk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('project.yml', 'scripts/install_xcodegen.sh') }}
      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          XCODEGEN_INSTALL_DIR="$RUNNER_TOOL_CACHE/xcodegen/2.44.1" bash scripts/install_xcodegen.sh
          echo "$RUNNER_TOOL_CACHE/xcodegen/2.44.1/bin" >> "$GITHUB_PATH"
          test "$(xcodegen --version | awk 'NR == 1 {print $NF}')" = "$XCODEGEN_VERSION"
      - name: Verify semantic CI contract
        run: bash scripts/tests/test_ci_workflow_semantics.sh
      - name: Verify coverage summary schema
        run: bash scripts/tests/test_coverage_summary.sh
      - name: Verify reproducible project generation
        run: bash scripts/tests/test_reproducible_project_generation.sh
      - name: Generate project and reject drift
        run: |
          set -euo pipefail
          xcodegen generate
          git diff --exit-code -- MacTalk.xcodeproj
      - name: Build whisper.cpp without network/model steps
        run: |
          set -euo pipefail
          cd Vendor/whisper.cpp
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=ON
          cmake --build . --config Release -j "$(sysctl -n hw.ncpu)"
      - name: Run deterministic unit lane
        shell: bash
        run: |
          set +e
          mkdir -p build/ci
          scripts/test-lanes.sh unit 2>&1 | tee build/ci/unit.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload unit log
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: mactalk-unit-log
          path: build/ci/unit.log
          if-no-files-found: warn

  coverage:
    name: Deterministic coverage (blocking)
    runs-on: macos-15
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee build-xcode-version.txt
          grep -F "Xcode ${MACTALK_XCODE_VERSION}" build-xcode-version.txt
          printf 'xcode_version=%s\n' "$(shasum -a 256 build-xcode-version.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: mactalk-spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode_version }}-${{ hashFiles('MacTalk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('project.yml', 'scripts/install_xcodegen.sh') }}
      - name: Install pinned XcodeGen and verify project
        shell: bash
        run: |
          set -euo pipefail
          XCODEGEN_INSTALL_DIR="$RUNNER_TOOL_CACHE/xcodegen/2.44.1" bash scripts/install_xcodegen.sh
          echo "$RUNNER_TOOL_CACHE/xcodegen/2.44.1/bin" >> "$GITHUB_PATH"
          bash scripts/tests/test_reproducible_project_generation.sh
          xcodegen generate
          git diff --exit-code -- MacTalk.xcodeproj
      - name: Build whisper.cpp without network/model steps
        run: |
          set -euo pipefail
          cd Vendor/whisper.cpp
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=ON
          cmake --build . --config Release -j "$(sysctl -n hw.ncpu)"
      - name: Run deterministic coverage lane
        shell: bash
        run: |
          set +e
          mkdir -p build/coverage
          MACTALK_COVERAGE_DIR="$PWD/build/coverage" bash scripts/coverage.sh
          test_status=$?
          MACTALK_COVERAGE_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/coverage-summary.sh "$PWD/build/coverage/MacTalk.xcresult"
          report_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          exit "$report_status"
      - name: Upload coverage bundle, reports, and logs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: mactalk-coverage
          path: |
            build/coverage/MacTalk.xcresult
            build/coverage/xcodebuild.log
            build/coverage/coverage.json
            build/coverage/coverage-by-file.txt
            build/coverage/test-results-summary.json
          if-no-files-found: warn

  tsan:
    name: ThreadSanitizer (scheduled/manual blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select documented Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "/Applications/Xcode_${MACTALK_XCODE_VERSION}.app" ]; then
            echo "TSAN/UNAVAILABLE: documented Xcode ${MACTALK_XCODE_VERSION} is not installed on macos-15" >&2
            exit 1
          fi
          sudo xcode-select -s "/Applications/Xcode_${MACTALK_XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version | tee build-xcode-version.txt
          grep -F "Xcode ${MACTALK_XCODE_VERSION}" build-xcode-version.txt
      - name: Standalone clang ThreadSanitizer smoke (first)
        run: bash scripts/tsan-smoke.sh
      - name: Install pinned XcodeGen and generate project
        shell: bash
        run: |
          set -euo pipefail
          XCODEGEN_INSTALL_DIR="$RUNNER_TOOL_CACHE/xcodegen/2.44.1" bash scripts/install_xcodegen.sh
          echo "$RUNNER_TOOL_CACHE/xcodegen/2.44.1/bin" >> "$GITHUB_PATH"
          bash scripts/tests/test_reproducible_project_generation.sh
          xcodegen generate
          git diff --exit-code -- MacTalk.xcodeproj
      - name: Build whisper.cpp without network/model steps
        run: |
          set -euo pipefail
          cd Vendor/whisper.cpp
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=ON
          cmake --build . --config Release -j "$(sysctl -n hw.ncpu)"
      - name: Run genuine instrumented TSan lane
        shell: bash
        run: |
          set +e
          mkdir -p build/ci
          scripts/test-lanes.sh tsan 2>&1 | tee build/ci/tsan.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload TSan log
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: mactalk-tsan-log
          path: build/ci/tsan.log
          if-no-files-found: warn

  appkit:
    name: AppKit/window manual lane (non-blocking by policy)
    if: github.event_name == 'workflow_dispatch' && inputs.run_appkit == true
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          persist-credentials: false
      - name: Run explicit AppKit lane
        run: scripts/test-lanes.sh appkit

  lint:
    name: Lint and CI static checks (blocking)
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          persist-credentials: false
      - name: Run blocking lint/static checks
        run: bash scripts/ci-static-checks.sh

  security:
    name: Security checks (blocking)
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          persist-credentials: false
      - name: Run blocking security checks
        run: bash scripts/ci-security-checks.sh

  documentation:
    name: Documentation checks (blocking)
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          persist-credentials: false
      - name: Run blocking documentation checks
        run: bash scripts/ci-docs-checks.sh
